# Sobe tudo no servidor: aplicação + PostgreSQL + Caddy (HTTPS automático).
# Uso:  cp .env.exemplo .env  (edite os valores)  &&  docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/barbearia
      DATABASE_USER: barbearia
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: barbearia
      POSTGRES_USER: barbearia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbearia"]
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - dados-caddy:/data
    depends_on:
      - app

volumes:
  dados-postgres:
  dados-caddy:
