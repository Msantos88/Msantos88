<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16130f">
  <title>Agenda | Barbearia</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="topo">
  <div class="marca"><span class="poste" aria-hidden="true"></span><h1>Agenda do dia</h1></div>
</header>
<main class="container">
  <div class="filtro">
    <label>Data<input type="date" id="data"></label>
    <button class="btn sec" id="anterior" aria-label="Dia anterior">‹</button>
    <button class="btn sec" id="hoje">Hoje</button>
    <button class="btn sec" id="proximo" aria-label="Próximo dia">›</button>
  </div>
  <div id="erro" class="erro" role="alert" hidden></div>
  <div class="totais">
    <div><small>Confirmados</small><b id="t-confirmados">0</b></div>
    <div><small>Sinais recebidos</small><b id="t-sinais">R$ 0,00</b></div>
    <div><small>A receber no balcão</small><b id="t-receber">R$ 0,00</b></div>
  </div>
  <div class="rolagem">
    <table class="tabela">
      <thead><tr><th>Horário</th><th>Cliente</th><th>Serviço</th><th>Barbeiro</th><th>Status</th><th>Valores</th><th></th></tr></thead>
      <tbody id="linhas"></tbody>
    </table>
  </div>
  <p id="vazio" class="vazio" hidden>Nenhum agendamento neste dia.</p>
</main>
<footer class="rodape"><a href="./">Página de agendamento</a></footer>
<script src="admin.js"></script>
</body>
</html>
