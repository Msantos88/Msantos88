spring:
  application:
    name: barbearia-agendamento
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/barbearia;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  # Usa o IP real do cliente informado pelo Caddy (X-Forwarded-For), confiando apenas em proxies
  # da rede interna — um cliente não consegue falsificar o próprio IP enviando esse cabeçalho.
  forward-headers-strategy: native

barbearia:
  nome: ${BARBEARIA_NOME:Ewerton Gois}
  slogan: ${BARBEARIA_SLOGAN:Barbearia · Desde 2010}
  whatsapp: ${BARBEARIA_WHATSAPP:}          # só dígitos com DDD, ex.: 11912345678
  instagram: ${BARBEARIA_INSTAGRAM:}        # usuário sem @
  endereco: ${BARBEARIA_ENDERECO:Rua General Azevedo Pimentel, 33}
  bairro-cidade: ${BARBEARIA_BAIRRO_CIDADE:Jardim Colonial, São Paulo/SP}
  horario-atendimento: ${BARBEARIA_HORARIO:Terça a sábado · 9h às 19h}
  fuso-horario: America/Sao_Paulo
  percentual-sinal: 50              # % do valor pago antecipadamente para garantir a reserva
  minutos-para-pagar-sinal: 30      # tempo que o horário fica segurado aguardando o PIX
  intervalo-entre-horarios-minutos: 30
  antecedencia-minima-minutos: 60
  dias-maximos-para-agendar: 30
  abertura: "09:00"
  fechamento: "19:00"
  dias-de-funcionamento: [TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY]
  verificacao-pendentes-ms: 60000
  admin:
    usuario: ${ADMIN_USUARIO:admin}
    senha: ${ADMIN_SENHA:}            # vazio = senha aleatória exibida no log ao iniciar
  seguranca:
    requisicoes-por-minuto: 120       # por IP, todas as rotas /api
    reservas-por-ip: 5                # reservas que um mesmo IP pode criar...
    janela-reservas: 1h               # ...dentro deste período
    tentativas-de-login: 10           # senhas erradas no painel antes de bloquear o IP...
    bloqueio-login: 15m               # ...por este tempo

pagamento:
  # "simulador" (desenvolvimento) ou "mercadopago" (produção)
  provedor: ${PAGAMENTO_PROVEDOR:simulador}
  mercadopago:
    base-url: https://api.mercadopago.com
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    notification-url: ${MERCADOPAGO_NOTIFICATION_URL:}
